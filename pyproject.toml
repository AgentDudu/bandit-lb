[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bandit-lb"
version = "0.1.0"
description = "Asynchronous contextual bandit dynamic request router and load balancer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Lead Systems Engineer", email = "dev@bandit-lb.local" },
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["bandit_lb"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".agents", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "PT", "RET", "SIM"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
